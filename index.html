<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis E-Commerce - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">A<span>X</span>IS</a>

            <form class="search-bar" action="produtos.html" method="get">
                <input type="text" name="busca" placeholder="Pesquisar" aria-label="Pesquisar produtos">
                <button type="submit" aria-label="Buscar">
                    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
                </button>
            </form>

            <div class="nav-icons">
                <a href="login.html" aria-label="Minha conta">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                </a>
                <a href="carrinho.html" aria-label="Carrinho de compras">
                    <svg viewBox="0 0 24 24"><path d="M2 3h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                </a>
                <a href="#menu" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="3" y="11" width="18" height="2.4" rx="1.2"/><rect x="3" y="17" width="18" height="2.4" rx="1.2"/></svg>
                </a>
            </div>
        </nav>
    </header>

    <main>

        <!-- Banner Principal -->
        <section class="hero-wrapper" aria-label="Destaques">
            <button class="hero-arrow" aria-label="Slide anterior">
                <svg viewBox="0 0 24 24"><path d="M15 4l-9 8 9 8V4z"/></svg>
            </button>

            <div class="hero">
                <div class="hero-text">
                    <h1>Tecnologia que mudará<span class="destaque">o seu mundo</span></h1>
                    <p>O melhor em hardware e gadgets com entrega relâmpago</p>
                    <a href="produtos.html" class="btn">Ver Ofertas</a>
                </div>

                <div class="hero-media">
                    <!-- Mascote Axis: substituir pelo arquivo exportado do Canva quando disponível -->
                    <svg class="hero-mascot" viewBox="0 0 200 260" aria-hidden="true">
                        <circle cx="100" cy="55" r="38" fill="#FFFFFF"/>
                        <rect x="70" y="20" width="60" height="10" rx="5" fill="#8E8E8E"/>
                        <circle cx="85" cy="55" r="7" fill="#FF6B00"/>
                        <circle cx="115" cy="55" r="7" fill="#FF6B00"/>
                        <path d="M82 75 Q100 88 118 75" stroke="#FF6B00" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <rect x="60" y="95" width="80" height="90" rx="18" fill="#FFFFFF"/>
                        <rect x="85" y="115" width="30" height="16" rx="4" fill="#004B63"/>
                        <rect x="60" y="120" width="12" height="45" rx="6" fill="#FF6B00"/>
                        <rect x="128" y="120" width="12" height="45" rx="6" fill="#FF6B00"/>
                        <rect x="72" y="185" width="24" height="55" rx="10" fill="#FFFFFF"/>
                        <rect x="104" y="185" width="24" height="55" rx="10" fill="#FFFFFF"/>
                        <circle cx="84" cy="245" r="12" fill="#00C853" opacity="0.7"/>
                        <circle cx="116" cy="245" r="12" fill="#00C853" opacity="0.7"/>
                    </svg>

                    <svg class="hero-logomark" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#FF6B00" stroke-width="5"/>
                        <path d="M35 65 L68 32 L58 34 L62 24 L72 28 L68 32" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <polygon points="70,20 78,28 62,34" fill="#FF6B00"/>
                    </svg>
                </div>
            </div>

            <button class="hero-arrow" aria-label="Próximo slide">
                <svg viewBox="0 0 24 24"><path d="M9 4l9 8-9 8V4z"/></svg>
            </button>
        </section>

        <!-- Categorias -->
        <section class="categorias" aria-label="Categorias de produtos">
            <a href="produtos.html?categoria=smartphones" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><line x1="11" y1="18.5" x2="13" y2="18.5" stroke="#fff" stroke-width="1.8"/></svg>
                </span>
                <span class="categoria-nome">Smartphones</span>
            </a>
            <a href="produtos.html?categoria=notebooks" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.8"/><line x1="1" y1="19" x2="23" y2="19" stroke="#fff" stroke-width="1.8"/></svg>
                </span>
                <span class="categoria-nome">Notebooks</span>
            </a>
            <a href="produtos.html?categoria=televisores" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="1.5" fill="none" stroke="#fff" stroke-width="1.8"/><line x1="8" y1="21" x2="16" y2="21" stroke="#fff" stroke-width="1.8"/></svg>
                </span>
                <span class="categoria-nome">Televisores</span>
            </a>
            <a href="produtos.html?categoria=audio" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="#fff" stroke-width="1.8"/><rect x="2" y="13" width="5" height="7" rx="2" fill="#fff"/><rect x="17" y="13" width="5" height="7" rx="2" fill="#fff"/></svg>
                </span>
                <span class="categoria-nome">Áudio Profissional</span>
            </a>
            <a href="produtos.html?categoria=pcs" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="9" cy="6" r="1" fill="#fff"/><circle cx="13" cy="6" r="1" fill="#fff"/></svg>
                </span>
                <span class="categoria-nome">Pcs</span>
            </a>
            <a href="produtos.html?categoria=tablets" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
                </span>
                <span class="categoria-nome">Tablets</span>
            </a>
            <a href="produtos.html?categoria=conectividade" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><path d="M4 10a12 12 0 0 1 16 0" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M7 13.5a8 8 0 0 1 10 0" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="18" r="1.6" fill="#fff"/></svg>
                </span>
                <span class="categoria-nome">Conectividade</span>
            </a>
            <a href="produtos.html?categoria=acessorios" class="categoria-item">
                <span class="categoria-icone">
                    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><line x1="12" y1="8" x2="12" y2="12" stroke="#fff" stroke-width="1.8"/></svg>
                </span>
                <span class="categoria-nome">Acessórios</span>
            </a>
        </section>

    </main>

    <footer>
        <p>&copy; Axis E-Commerce - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
