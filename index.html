<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis E-Commerce - Home</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="assets/icons/header/icon-logo.svg" alt="Logo AXIS">
                A<span>X</span>IS
            </a>

            <form class="search-bar" action="produtos.html" method="get">
                <input type="text" name="busca" placeholder="Pesquisar" aria-label="Pesquisar produtos">
                <button type="submit" aria-label="Buscar">
                    <img src="assets/icons/header/icon-search.svg" alt="Buscar">
                </button>
            </form>

            <div class="nav-icons">
                <a href="login.html" aria-label="Minha conta">
                    <img src="assets/icons/header/icon-user.svg" alt="Minha Conta">
                </a>
                <a href="carrinho.html" aria-label="Carrinho de compras">
                    <img src="assets/icons/header/icon-cart.svg" alt="Carrinho">
                </a>
                <a href="#menu" aria-label="Abrir menu">
                    <img src="assets/icons/header/icon-menu.svg" alt="Menu">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Banner Principal -->
        <section class="hero-wrapper" aria-label="Destaques">
            <button class="hero-arrow" aria-label="Slide anterior">
                ‹
            </button>

            <div class="hero">
                <div class="hero-text">
                    <h1>Tecnologia que mudará<span class="destaque">o seu mundo</span></h1>
                    <p>O melhor em hardware e gadgets com entrega relâmpago</p>
                    <a href="produtos.html" class="btn">Ver Ofertas</a>
                </div>

                <div class="hero-media">
                    <!-- Mascote Axis exportado do Canva -->
                    <img src="assets/images/mascot/robot-banner.png" alt="Mascote Axis" class="hero-mascot">
                    
                    <!-- Selo promocional do banner -->
                    <img src="assets/images/banner/badge-discount.png" alt="Selo Desconto" class="hero-logomark">
                </div>
            </div>

            <button class="hero-arrow" aria-label="Próximo slide">
                ›
            </button>
        </section>

        <!-- Categorias -->
        <section class="categorias" aria-label="Categorias de produtos">
            <a href="produtos.html?categoria=smartphones" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-celulares.png" alt="Smartphones">
                </span>
                <span class="categoria-nome">Smartphones</span>
            </a>
            
            <a href="produtos.html?categoria=hardware" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-hardware.png" alt="Hardware">
                </span>
                <span class="categoria-nome">Hardware</span>
            </a>

            <a href="produtos.html?categoria=perifericos" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-perifericos.png" alt="Periféricos">
                </span>
                <span class="categoria-nome">Periféricos</span>
            </a>

            <a href="produtos.html?categoria=games" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-games.png" alt="Games">
                </span>
                <span class="categoria-nome">Games</span>
            </a>

            <a href="produtos.html?categoria=audio" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-audio.png" alt="Áudio">
                </span>
                <span class="categoria-nome">Áudio Profissional</span>
            </a>

            <a href="produtos.html?categoria=promocoes" class="categoria-item">
                <span class="categoria-icone">
                    <img src="assets/images/departments/dept-promocoes.png" alt="Promoções">
                </span>
                <span class="categoria-nome">Ofertas</span>
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; Axis E-Commerce - Todos os direitos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
