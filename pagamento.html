<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AXIS | Pagamento e entrega</title>
  <link rel="icon" type="image/png" href="assets/icons/header/icon-search.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page page--payment">
  <!-- CABEÇALHO (igual ao das demais páginas da loja) -->
  <header class="site-header">
    <nav class="topbar" aria-label="Navegação principal">
      <a class="brand" href="index.html" aria-label="AXIS - Página inicial">
        <img src="assets/icons/header/icon-logo.png" alt="AXIS">
      </a>

      <form class="search-bar" action="produtos.html" method="get" role="search">
        <label class="sr-only" for="busca">Pesquisar produtos</label>
        <input id="busca" name="busca" type="search" placeholder="Pesquisar">
        <button type="submit" aria-label="Buscar produtos">
          <img src="assets/icons/header/icon-search.png" alt="">
        </button>
      </form>

      <div class="header-actions" aria-label="Ações rápidas">
        <a class="header-icon" href="login.html" aria-label="Minha conta">
          <img src="assets/icons/header/icon-user.png" alt="">
        </a>

        <a class="header-icon" href="carrinho.html" aria-label="Carrinho">
          <img src="assets/icons/header/icon-cart.png" alt="">
        </a>

        <button class="header-icon menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" title="Abrir menu">
          <img src="assets/icons/header/icon-menu.png" alt="">
          <span class="sr-only">Abrir menu</span>
        </button>
      </div>
    </nav>

    <nav id="site-menu" class="site-menu" aria-label="Menu secundário" hidden>
      <ul>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="minha-conta.html">Minha conta</a></li>
        <li><a href="ajuda.html">Ajuda</a></li>
      </ul>
    </nav>
  </header>

  <main class="payment-main">
    <h1>Pagamento e Entrega</h1>

    <div class="payment-layout">
      <!-- Formulário: endereço + forma de pagamento -->
      <form class="payment-form" id="form-pagamento">
        <section class="payment-group">
          <h2>Endereço de Entrega</h2>

          <div class="payment-address">
            <input class="payment-field" type="text" name="endereco" placeholder="Rua Boaventura, 67" aria-label="Endereço" autocomplete="street-address" required>
            <input class="payment-field" type="text" name="cep" placeholder="CEP" aria-label="CEP" inputmode="numeric" autocomplete="postal-code" required>
          </div>
        </section>

        <section class="payment-group">
          <h2>Método de Pagamento</h2>

          <label class="payment-option">
            <input type="radio" name="pagamento" value="pix" required>
            <span class="payment-option__icon" aria-hidden="true">❖</span>
            <span>PIX (Aprovação Imediata)</span>
          </label>

          <label class="payment-option">
            <input type="radio" name="pagamento" value="cartao">
            <span class="payment-option__icon" aria-hidden="true">▰</span>
            <span>Cartão de Crédito</span>
          </label>
        </section>
      </form>

      <!-- Coluna da direita: selo de segurança + botão (fora do <form>, ligado a ele pelo atributo form=) -->
      <section class="payment-secure">
        <div class="payment-shield" aria-hidden="true"></div>
        <h2>Sua compra é segura</h2>

        <button class="button button--offer button--full payment-submit" type="submit" form="form-pagamento">
          Finalizar pedido
        </button>

        <p class="payment-message" id="mensagem" role="status" hidden></p>
      </section>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer"><p>© 2026 AXIS. Todos os direitos reservados.</p></footer>

  <script src="js/main.js"></script>
</body>
</html>
