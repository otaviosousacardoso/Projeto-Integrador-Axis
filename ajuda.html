<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axis | Ajuda</title>
	<link rel="icon" type="image/png" href="assets/icons/header/icon-search.png">
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
  <div class="page page--help">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="index.html" aria-label="Página inicial da Axis">
          <img src="assets/icons/header/icon-logo.png" alt="Axis">
        </a>
        <form class="search-bar" role="search">
          <input
            type="search"
            name="busca"
            placeholder="Pesquisar"
            aria-label="Pesquisar produtos"
          >
          <button type="submit" aria-label="Pesquisar">
            <img src="assets/icons/header/icon-search.png" alt="">
          </button>
        </form>
        <div class="header-actions" aria-label="Atalhos">
          <a class="header-icon" href="login.html" aria-label="Minha conta">
            <img src="assets/icons/header/icon-user.png" alt="">
          </a>
          <a class="header-icon" href="carrinho.html" aria-label="Carrinho">
            <img src="assets/icons/header/icon-cart.png" alt="">
          </a>
          <button
            class="header-icon menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-menu"
            title="Abrir menu"
          >
            <img src="assets/icons/header/icon-menu.png" alt="">
            <span class="sr-only">Abrir menu</span>
          </button>
        </div>
      </div>
      <nav class="site-menu" id="site-menu" aria-label="Navegação principal" hidden>
        <ul>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="minha-conta.html">Minha conta</a></li>
        </ul>
      </nav>
    </header>
    <main class="help-main">
      <h1 id="help-title" class="help-title">Como podemos te ajudar?</h1>
      <section class="help-content" aria-labelledby="help-title">
        <img
          class="help-robot"
          src="assets/images/mascot/robot-help-recortado.png"
          alt="Assistente virtual Axis segurando uma prancheta"
        >
        <section class="faq-card" aria-labelledby="faq-title">
          <h2 id="faq-title">Perguntas frequentes</h2>
          <dl>
            <dt>Qual o tempo de garantia?</dt>
            <dd>Oferecemos 8 meses de garantia total em todos os eletrônicos.</dd>
            <dt>Entregam para todo o Brasil?</dt>
            <dd>Sim, via transportadoras com seguro total da carga.</dd>
          </dl>
          <button
            class="button button--offer button--full"
            type="button"
            id="contact-button"
          >
            Falar com atendente
          </button>
        </section>
      </section>
    </main>
    <footer class="site-footer"><p>© 2026 AXIS. Todos os direitos reservados.</p></footer>
  </div>
  <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
